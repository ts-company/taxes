services:

  db:
    image: pgvector/pgvector:pg15
    container_name: taxes_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: taxes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5435:5432"

  app:
    build: ./backend
    container_name: taxes
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:admin@db:5432/taxes_db
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app/static:/app/static

  frontend:
    build: ./frontend
    container_name: taxes_frontend
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"

volumes:
  postgres_data: