<section class="accounts-view" aria-labelledby="accountsTitle">
    <header class="accounts-heading">
        <div>
            <h1 id="accountsTitle">Accounts</h1>
            <p class="accounts-subtitle">{{ users|length }} account{% if users|length != 1 %}s{% endif %}</p>
        </div>
        <div class="accounts-toolbar">
            <button class="accounts-button primary" type="button" data-action="toggle-add-user" aria-expanded="false" aria-controls="addUserPanel">Add user</button>
            <button class="accounts-button" id="accountsRefresh" type="button">Refresh</button>
        </div>
    </header>

    <p class="accounts-feedback" id="accountsFeedback" role="status" aria-live="polite" hidden></p>

    <section class="accounts-panel" id="addUserPanel" hidden aria-labelledby="addUserTitle">
        <h2 id="addUserTitle">Create an account</h2>
        <form class="accounts-form" id="addUserForm">
            <label>First name<input name="first_name" autocomplete="given-name" required></label>
            <label>Last name<input name="last_name" autocomplete="family-name" required></label>
            <label>Username<input name="username" autocomplete="username" required></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" required></label>
            <label>Role
                <select name="role" required>
                    <option value="admin">Admin</option>
                </select>
            </label>
            <div class="accounts-form-actions">
                <button class="accounts-button primary" type="submit">Create user</button>
                <button class="accounts-button" type="button" data-action="toggle-add-user">Cancel</button>
            </div>
            <p class="accounts-form-message" role="status" aria-live="polite" hidden></p>
        </form>
    </section>

    <div class="accounts-table-wrap">
        <table class="accounts-table">
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Role</th>
                    <th scope="col">Status</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr data-user-id="{{ user.id }}">
                    <td>{{ user.name }}</td>
                    <td>{{ user.role }}</td>
                    <td>
                        <span class="account-status{% if not user.is_active %} inactive{% endif %}">
                            {{ "Active" if user.is_active else "Inactive" }}
                        </span>
                    </td>
                    <td class="accounts-row-actions">
                        <button class="accounts-button" type="button" data-action="{{ 'deactivate' if user.is_active else 'activate' }}" data-user-id="{{ user.id }}">
                            {{ "Deactivate" if user.is_active else "Activate" }}
                        </button>
                        <button class="accounts-button admin-only danger" type="button" data-action="permissions" data-user-id="{{ user.id }}">Permissions</button>
                        <button class="accounts-button danger" type="button" data-action="delete" data-user-id="{{ user.id }}">Delete</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td class="accounts-empty" colspan="4">No accounts to display.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <dialog class="accounts-dialog" id="permissionsDialog" aria-labelledby="permissionsTitle">
        <div class="accounts-dialog-heading">
            <div>
                <h2 id="permissionsTitle">User permissions</h2>
                <p id="permissionsUserName" class="accounts-help"></p>
            </div>
            <button class="accounts-button" type="button" data-action="close-permissions" aria-label="Close permissions">Close</button>
        </div>
        <p class="accounts-form-message" id="permissionsMessage" role="status" aria-live="polite" hidden></p>
        <ul class="permissions-list" id="permissionsList"></ul>
        <form class="accounts-form permission-form" id="addPermissionForm">
            <label>Permission type<input name="type" required maxlength="120" placeholder="e.g. manage users"></label>
            <input name="user_id" type="hidden">
            <button class="accounts-button primary" type="submit">Add permission</button>
        </form>
    </dialog>
</section>
