<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3529a4">
    <title>System</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #30334b;
            --muted: #81869e;
            --violet: #655cbb;
            --green: #12af72;
            --line: #e8e9f1;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            height: 100vh;
            overflow: hidden;
            color: white;
            background: #29268e;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            color: inherit;
            cursor: pointer;
        }

        .app {
            height: 100%;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 78% 78%, rgba(0, 229, 255, .62), transparent 23%),
                radial-gradient(ellipse at 73% 94%, rgba(28, 169, 255, .48), transparent 30%),
                radial-gradient(ellipse at 22% 85%, rgba(88, 56, 213, .72), transparent 38%),
                radial-gradient(ellipse at 82% 12%, rgba(55, 51, 175, .8), transparent 37%),
                linear-gradient(118deg, #4843ad 0%, #37329c 42%, #171e71 100%);
        }

        .app::before,
        .app::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .app::before {
            width: 620px;
            height: 620px;
            right: 7%;
            bottom: -340px;
            border-radius: 47% 53% 61% 39%;
            border: 2px solid rgba(163, 246, 255, .5);
            transform: rotate(-34deg);
            box-shadow: 0 0 22px #48dcff, inset 0 0 38px rgba(106, 212, 255, .55), 0 0 100px rgba(27, 201, 255, .28);
        }

        .app::after {
            width: 430px;
            height: 560px;
            right: 9%;
            bottom: -260px;
            border-radius: 48% 52% 43% 57%;
            border: 1px solid rgba(203, 249, 255, .44);
            transform: rotate(29deg);
            box-shadow: inset 0 0 50px rgba(117, 234, 255, .35), 0 0 24px rgba(120, 224, 255, .4);
        }

        .topbar {
            height: 72px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 0 28px 0 96px;
            background: rgba(53, 52, 145, .38);
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }

        .brand-menu {
            position: absolute;
            left: 0;
            top: 0;
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            border-right: 1px solid rgba(255, 255, 255, .08);
            padding: 0;
            color: white;
            background: transparent;
            border-top: 0;
            border-left: 0;
            border-bottom: 0;
            cursor: pointer;
        }

        .hamburger {
            width: 18px;
            height: 14px;
            border-block: 2px solid white;
            position: relative;
            opacity: .8;
        }

        .hamburger::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 5px;
            border-top: 2px solid white;
        }

        .primary-nav {
            height: 100%;
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-link {
            border: 0;
            background: transparent;
            padding: 10px 12px;
            border-radius: 9px;
            color: rgba(255, 255, 255, .82);
            font-size: 15px;
        }

        .nav-link.active {
            background: rgba(255, 255, 255, .27);
            color: #fff;
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .brand {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            text-decoration: none;
        }

        .pill {
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 18px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, .08);
            font-size: 13px;
        }

        .pill.plan {
            background: #04a76e;
            border-color: transparent;
        }

        .clock {
            display: flex;
            align-items: center;
            gap: 7px;
            border-radius: 18px;
            padding: 6px 12px;
            background: #168df2;
            font-weight: 700;
            font-size: 13px;
        }

        .avatar {
            width: 31px;
            height: 31px;
            margin-left: -10px;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, .35);
            border-radius: 50%;
            background: #a5aabb;
            font-size: 14px;
        }

        .sidebar {
            position: absolute;
            z-index: 3;
            left: 0;
            top: 72px;
            bottom: 0;
            width: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            padding: 18px 0;
            background: rgba(58, 55, 160, .29);
            border-right: 1px solid rgba(255, 255, 255, .08);
            transition: width .2s ease, background-color .2s ease, padding .2s ease;
            overflow: hidden;
        }

        .menu-backdrop {
            position: absolute;
            z-index: 2;
            inset: 0;
            border: 0;
            background: rgba(8, 18, 45, .32);
        }

        .menu-heading,
        .side-label,
        .side-chevron {
            display: none;
        }

        .menu-heading {
            height: 36px;
            flex: none;
            align-items: center;
            gap: 14px;
            padding: 0 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .16);
            margin-bottom: 14px;
            white-space: nowrap;
        }

        .sidebar-link {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 44px;
            min-height: 44px;
            padding: 0;
            border: 0;
            border-radius: 11px;
            color: rgba(255, 255, 255, .92);
            background: transparent;
            cursor: pointer;
        }

        .sidebar-link .side-button {
            flex: none;
        }

        .side-label {
            font-size: 16px;
            white-space: nowrap;
        }

        .side-chevron {
            margin-left: auto;
            font-size: 18px;
        }

        .sidebar-link.bottom {
            margin-top: auto;
        }

        .app.menu-open .sidebar {
            z-index: 4;
            top: 0;
            width: min(298px, calc(100vw - 56px));
            align-items: stretch;
            gap: 7px;
            padding: 12px 16px 18px;
            background: rgba(29, 48, 76, .97);
            border-right-color: rgba(255, 255, 255, .08);
        }

        .app.menu-open .menu-heading,
        .app.menu-open .side-label,
        .app.menu-open .side-chevron {
            display: flex;
        }

        .app.menu-open .sidebar-link {
            width: 100%;
            justify-content: flex-start;
            padding: 0 8px;
        }

        .app.menu-open .sidebar-link.selected {
            background: rgba(255, 255, 255, .19);
        }

        .app.menu-open .sidebar-link .side-button {
            width: 28px;
            height: 36px;
            font-size: 19px;
        }

        .app.menu-open .side-separator {
            width: 100%;
            margin: 2px 0 10px;
            border-color: rgba(255, 255, 255, .18);
        }

        .side-button {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 11px;
            color: rgba(255, 255, 255, .92);
            background: transparent;
            display: grid;
            place-items: center;
            font-size: 22px;
        }

        .side-button.selected {
            background: rgba(255, 255, 255, .27);
        }

        .side-button.bottom {
            margin-top: auto;
        }

        .side-separator {
            width: 18px;
            border-top: 1px solid rgba(255, 255, 255, .5);
            margin: 3px 0 10px;
        }

        .workspace {
            position: relative;
            z-index: 1;
            height: 100%;
            margin-left: 72px;
            padding: 24px 4.6% 16px 24px;
            display: flex;
            flex-direction: column;
        }

        .home-view {
            position: absolute;
            z-index: 1;
            inset: 72px 0 0 72px;
            overflow: auto;
            padding: 30px clamp(18px, 4vw, 56px);
            color: white;
        }

        .home-placeholder {
            max-width: 920px;
            margin: 24px auto;
        }

        .home-placeholder h1 {
            font-size: 30px;
        }

        .accounts-view {
            max-width: 1100px;
            margin: 8px auto;
            color: #263143;
        }

        .accounts-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            color: white;
        }

        .accounts-heading h1 {
            font-size: 28px;
        }

        .accounts-refresh {
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 8px;
            color: white;
            background: rgba(255, 255, 255, .14);
        }

        .accounts-table-wrap {
            overflow: auto;
            border-radius: 8px;
            background: white;
            box-shadow: 0 10px 35px rgba(12, 14, 73, .13);
        }

        .accounts-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .accounts-table th,
        .accounts-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #e8eaf0;
        }

        .accounts-table th {
            color: #697386;
            background: #f7f8fa;
            font-size: 13px;
            font-weight: 600;
        }

        .accounts-table td {
            color: #30394a;
            font-size: 14px;
        }

        .account-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #23754d;
            font-size: 13px;
        }

        .account-status::before {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #35a66d;
            content: "";
        }

        .account-status.inactive {
            color: #7a6470;
        }

        .account-status.inactive::before {
            background: #a6a1aa;
        }

        .accounts-empty,
        .accounts-message {
            padding: 24px;
            color: #697386;
            text-align: center;
        }

        .heading-row {
            display: flex;
            align-items: center;
            gap: 13px;
            min-height: 42px;
        }

        h1 {
            margin: 0 2px 0 0;
            font-size: 27px;
            font-weight: 600;
            letter-spacing: 0;
        }

        .pin {
            color: rgba(255, 255, 255, .7);
            font-size: 20px;
            transform: rotate(-30deg);
        }

        .action-button {
            height: 38px;
            padding: 0 15px;
            border: 0;
            border-radius: 10px;
            background: var(--green);
            font-size: 14px;
            font-weight: 600;
        }

        .create-button {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .create-button .plus {
            font-size: 23px;
            line-height: 1;
            font-weight: 300;
        }

        .dropdown {
            height: 38px;
            border: 0;
            border-radius: 10px;
            padding: 0 14px;
            color: white;
            background: rgba(255, 255, 255, .2);
            font-size: 14px;
        }

        .search-box {
            height: 38px;
            width: min(400px, 27vw);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 10px;
            background: rgba(255, 255, 255, .12);
            color: rgba(255, 255, 255, .72);
        }

        .search-box input {
            width: 100%;
            min-width: 0;
            color: white;
            border: 0;
            outline: 0;
            background: transparent;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, .62);
        }

        .search-icon {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .72);
            border-radius: 50%;
            position: relative;
            flex: none;
        }

        .search-icon::after {
            content: "";
            position: absolute;
            width: 7px;
            border-top: 2px solid rgba(255, 255, 255, .72);
            right: -5px;
            bottom: -3px;
            transform: rotate(48deg);
        }

        .clear-search {
            border: 0;
            color: rgba(255, 255, 255, .72);
            background: none;
            font-size: 20px;
        }

        .sub-row {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 23px 0 24px;
            min-height: 31px;
        }

        .tab-group {
            display: flex;
            overflow: hidden;
            border-radius: 9px;
            background: rgba(255, 255, 255, .17);
        }

        .tab {
            height: 31px;
            padding: 0 12px;
            border: 0;
            color: rgba(255, 255, 255, .78);
            background: transparent;
            font-size: 13px;
        }

        .tab.active {
            color: white;
            background: rgba(255, 255, 255, .23);
        }

        .quick-filter {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 31px;
            padding: 0 12px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: rgba(255, 255, 255, .17);
            font-size: 13px;
        }

        .count {
            min-width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, .22);
            font-size: 12px;
        }

        .sub-spacer {
            flex: 1;
        }

        .tool-button {
            height: 31px;
            padding: 0 12px;
            border: 0;
            border-radius: 9px;
            background: rgba(255, 255, 255, .19);
            font-size: 13px;
        }

        .task-panel {
            flex: 1;
            min-height: 250px;
            max-height: 435px;
            position: relative;
            overflow: hidden;
            border-radius: 11px;
            color: var(--ink);
            background: rgba(255, 255, 255, .88);
            box-shadow: 0 10px 35px rgba(12, 14, 73, .13);
        }

        .table-head {
            height: 51px;
            display: grid;
            grid-template-columns: 42px minmax(145px, 1.2fr) minmax(145px, 1.4fr) minmax(115px, 1fr) minmax(145px, 1.2fr) minmax(145px, 1.2fr) minmax(100px, .8fr) minmax(100px, .8fr);
            align-items: center;
            border-bottom: 1px solid #e6e7ef;
            background: rgba(255, 255, 255, .95);
            color: #71788e;
            font-size: 14px;
        }

        .table-head>div {
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .table-head>div:nth-child(3) {
            background: rgba(227, 247, 250, .65);
        }

        .check {
            width: 14px;
            height: 14px;
            accent-color: #635ec3;
        }

        .settings {
            color: #9ca2ad;
            font-size: 17px;
            margin-right: 16px;
        }

        .name-heading {
            gap: 0;
        }

        .empty-state {
            position: absolute;
            inset: 51px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(255, 255, 255, .83);
        }

        .empty-state h2 {
            margin: -8px 0 25px;
            color: #464750;
            font-size: 33px;
            font-weight: 300;
        }

        .empty-state p {
            margin: 0;
            color: #9a9dad;
            font-size: 16px;
        }

        .task-list {
            position: absolute;
            inset: 51px 0 0;
            overflow-y: auto;
        }

        .task-row {
            min-height: 50px;
            display: grid;
            grid-template-columns: 42px minmax(145px, 1.2fr) minmax(145px, 1.4fr) minmax(115px, 1fr) minmax(145px, 1.2fr) minmax(145px, 1.2fr) minmax(100px, .8fr) minmax(100px, .8fr);
            align-items: center;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
        }

        .task-row>span {
            padding: 0 16px;
        }

        .status-tag {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 12px;
            color: #6e65ba;
            background: #eeecff;
            font-size: 12px;
        }

        .footer {
            display: flex;
            align-items: center;
            gap: 13px;
            min-height: 80px;
            padding-top: 17px;
            color: rgba(255, 255, 255, .77);
            font-size: 13px;
        }

        .footer-chip {
            padding: 7px 11px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .2);
        }

        .footer a {
            color: inherit;
            text-decoration: none;
        }

        .right-rail {
            position: absolute;
            z-index: 2;
            right: 14px;
            top: 82px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .rail-icon {
            position: relative;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 11px;
            color: white;
            background: rgba(255, 255, 255, .16);
            font-size: 18px;
        }

        .badge {
            position: absolute;
            right: -4px;
            top: -4px;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f44a63;
            font-size: 10px;
            line-height: 16px;
        }

        dialog {
            width: min(460px, calc(100% - 32px));
            padding: 0;
            border: 0;
            border-radius: 12px;
            color: var(--ink);
            box-shadow: 0 24px 80px rgba(8, 12, 65, .35);
        }

        dialog::backdrop {
            background: rgba(16, 18, 65, .55);
            backdrop-filter: blur(4px);
        }

        .dialog-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 22px;
            border-bottom: 1px solid var(--line);
        }

        .dialog-head h2 {
            margin: 0;
            font-size: 20px;
        }

        .dialog-close {
            border: 0;
            background: none;
            color: #73798b;
            font-size: 24px;
        }

        .task-form {
            display: grid;
            gap: 15px;
            padding: 20px 22px 22px;
        }

        .task-form label {
            display: grid;
            gap: 7px;
            color: #60677e;
            font-size: 13px;
        }

        .task-form input,
        .task-form textarea,
        .task-form select {
            width: 100%;
            padding: 10px 11px;
            border: 1px solid #dfe2eb;
            border-radius: 7px;
            outline-color: #766dc9;
            color: var(--ink);
            background: white;
        }

        .task-form textarea {
            resize: vertical;
            min-height: 76px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            padding-top: 3px;
        }

        .cancel-button {
            height: 38px;
            padding: 0 15px;
            border: 1px solid #dfe2eb;
            border-radius: 8px;
            color: #555b70;
            background: white;
        }

        @media (max-width: 1100px) {
            .topbar {
                gap: 10px;
                padding-right: 16px;
            }

            .nav-link {
                padding-inline: 8px;
                font-size: 13px;
            }

            .top-actions .pill:not(.plan) {
                display: none;
            }

            .workspace {
                padding-right: 30px;
            }

            .sub-row {
                gap: 7px;
            }

            .tab {
                padding-inline: 9px;
            }

            .quick-filter {
                padding-inline: 8px;
            }

            .table-head,
            .task-row {
                grid-template-columns: 38px minmax(120px, 1.2fr) minmax(125px, 1.3fr) minmax(100px, 1fr) minmax(115px, 1fr) minmax(105px, 1fr) minmax(80px, .7fr) minmax(80px, .7fr);
            }
        }

        @media (max-width: 760px) {
            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }

            .app {
                min-height: 100vh;
                height: auto;
                overflow: hidden;
            }

            .topbar {
                height: 60px;
                padding: 0 14px 0 65px;
            }

            .brand-menu {
                width: 56px;
                height: 60px;
            }

            .app.menu-open .sidebar {
                width: min(298px, calc(100vw - 56px));
            }

            .primary-nav .nav-link:not(.active) {
                display: none;
            }

            .primary-nav #accountsNav {
                display: inline-flex;
            }

            .top-actions {
                gap: 6px;
            }

            .top-actions .pill.plan {
                display: none;
            }

            .clock {
                padding: 6px 9px;
            }

            .sidebar {
                top: 60px;
                width: 56px;
                bottom: 0;
            }

            .side-button {
                width: 40px;
                height: 40px;
            }

            .workspace {
                height: auto;
                min-height: 100vh;
                margin-left: 56px;
                padding: 20px 16px 12px;
            }

            .home-view {
                position: relative;
                min-height: calc(100vh - 60px);
                inset: auto;
                margin-left: 56px;
                padding: 22px 16px;
            }

            .accounts-heading {
                align-items: flex-start;
            }

            .accounts-heading h1 {
                font-size: 24px;
            }

            .accounts-table th,
            .accounts-table td {
                padding: 12px;
                white-space: nowrap;
            }

            .heading-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            h1 {
                font-size: 23px;
            }

            .search-box {
                order: 5;
                width: 100%;
            }

            .dropdown {
                margin-left: auto;
            }

            .sub-row {
                flex-wrap: wrap;
                margin: 17px 0;
            }

            .tab-group {
                max-width: 100%;
                overflow-x: auto;
            }

            .tab {
                padding-inline: 8px;
            }

            .sub-spacer,
            .sub-row .tool-button:nth-last-child(2) {
                display: none;
            }

            .task-panel {
                height: 410px;
                flex: none;
                overflow-x: auto;
            }

            .table-head,
            .task-row {
                min-width: 850px;
            }

            .empty-state {
                min-width: 850px;
            }

            .empty-state h2 {
                font-size: 27px;
            }

            .empty-state p {
                max-width: 80%;
                line-height: 1.5;
            }

            .footer {
                min-height: 65px;
                flex-wrap: wrap;
                gap: 8px;
                font-size: 11px;
            }

            .footer a:nth-of-type(n+2) {
                display: none;
            }

            .right-rail {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <button class="brand-menu" id="menuToggle" type="button" aria-label="Expand menu" aria-expanded="false" aria-controls="workspaceMenu"><span class="hamburger"></span></button>
            <a class="brand" href="#" aria-label="Bitrix24 home">taxes</a>
            <nav class="primary-nav" aria-label="Main navigation">
                <button class="nav-link active" id="tasksNav" type="button" aria-controls="homeView" aria-pressed="true">Tasks</button>
                {% if role == "admin" or "manage users" in permisisons %}
                <button class="nav-link" id="accountsNav" type="button" aria-controls="homeView" aria-pressed="false">Users</button>
                {% endif %}
            </nav>
            <div class="top-actions">
                <button class="pill plan" type="button">Select a plan</button>
            </div>
        </header>

        <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Close menu" hidden></button>
        <aside class="sidebar" id="workspaceMenu" aria-label="Workspace tools">
            <div class="menu-heading"><span aria-hidden="true">☰</span><span>Expand menu</span></div>
            <button class="sidebar-link selected" type="button"><span class="side-button" aria-hidden="true">☑</span><span class="side-label">Tasks</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">♧</span><span class="side-label">Collaboration</span><span class="side-chevron">⌄</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">☷</span><span class="side-label">CRM</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">▦</span><span class="side-label">Booking</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">⌂</span><span class="side-label">Inventory management</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">◎</span><span class="side-label">Marketing</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">🛒</span><span class="side-label">Sites and stores</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">▥</span><span class="side-label">BI Builder</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">▣</span><span class="side-label">Employees</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">♙</span><span class="side-label">Automation</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">⬡</span><span class="side-label">Applications</span><span class="side-chevron">⌄</span></button>
            <button class="sidebar-link" type="button"><span class="side-button" aria-hidden="true">▤</span><span class="side-label">Knowledge base 2.0</span></button>
            <span class="side-separator"></span>
            <button class="sidebar-link bottom" type="button"><span class="side-button" aria-hidden="true">⚙</span><span class="side-label">Settings</span></button>
        </aside>

        <main class="home-view" id="homeView" aria-live="polite">
            <section class="home-placeholder">
                <h1>Tasks</h1>
            </section>
        </main>

        <script>
            const app = document.querySelector('.app');
            const menuToggle = document.querySelector('#menuToggle');
            const menuBackdrop = document.querySelector('#menuBackdrop');
            const tasksNav = document.querySelector('#tasksNav');
            const accountsNav = document.querySelector('#accountsNav');
            const homeView = document.querySelector('#homeView');
            const tasksMarkup = homeView.innerHTML;

            function setActiveView(activeButton) {
                [tasksNav, accountsNav].filter(Boolean).forEach((button) => {
                    const isActive = button === activeButton;
                    button.classList.toggle('active', isActive);
                    button.setAttribute('aria-pressed', String(isActive));
                });
            }

            async function showAccounts() {
                setActiveView(accountsNav);
                homeView.setAttribute('aria-busy', 'true');
                homeView.innerHTML = '<p class="accounts-message">Loading accounts...</p>';

                try {
                    const response = await fetch('/users/', { credentials: 'include' });
                    if (!response.ok) {
                        throw new Error(response.status === 403 ? 'You do not have permission to view accounts.' : 'Unable to load accounts. Please try again.');
                    }
                    homeView.innerHTML = await response.text();
                } catch (error) {
                    homeView.innerHTML = `<p class="accounts-message" role="alert">${error.message}</p>`;
                } finally {
                    homeView.setAttribute('aria-busy', 'false');
                }
            }

            function setMenuOpen(isOpen) {
                app.classList.toggle('menu-open', isOpen);
                menuToggle.setAttribute('aria-expanded', String(isOpen));
                menuToggle.setAttribute('aria-label', isOpen ? 'Collapse menu' : 'Expand menu');
                menuBackdrop.hidden = !isOpen;
            }

            menuToggle.addEventListener('click', () => {
                setMenuOpen(!app.classList.contains('menu-open'));
            });
            menuToggle.addEventListener('pointerenter', () => setMenuOpen(true));
            menuBackdrop.addEventListener('pointerenter', () => setMenuOpen(false));
            menuBackdrop.addEventListener('click', () => setMenuOpen(false));
            if (accountsNav) accountsNav.addEventListener('click', showAccounts);
            homeView.addEventListener('click', (event) => {
                if (event.target.closest('#accountsRefresh')) showAccounts();
            });
            tasksNav.addEventListener('click', () => {
                setActiveView(tasksNav);
                homeView.innerHTML = tasksMarkup;
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') setMenuOpen(false);
            });
        </script>

    </div>

</body>

</html>
