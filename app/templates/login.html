<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20273b">
  <title>Sign in | taxes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: #20273b;
      background: #f4f6f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #20273b;
      --muted: #70798a;
      --line: #dfe4e9;
      --accent: #6754d9;
      --accent-hover: #5543c5;
      --mint: #bcf1d9;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(410px, .92fr);
      background: #fff;
    }

    .visual-panel {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 38px clamp(28px, 5.2vw, 78px) 34px;
      color: #fff;
      background: #20273b;
    }

    .visual-panel::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background: url("https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1800&q=85") center / cover no-repeat;
      transform: scale(1.015);
    }

    .visual-panel::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(180deg, rgba(22, 31, 47, .38) 0%, rgba(22, 31, 47, .12) 40%, rgba(22, 31, 47, .88) 100%);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      color: #fff;
      text-decoration: none;
      font-family: "Manrope", sans-serif;
      font-size: 23px;
      font-weight: 800;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #17253a;
      background: var(--mint);
      font-size: 17px;
      line-height: 1;
    }

    .visual-copy { max-width: 560px; padding: 50px 0 34px; }
    .eyebrow { margin: 0 0 17px; color: #c3f2dd; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .visual-copy h1 {
      max-width: 540px;
      margin: 0;
      font-family: "Manrope", sans-serif;
      font-size: clamp(38px, 5vw, 66px);
      font-weight: 600;
      line-height: 1.08;
    }
    .visual-copy p { max-width: 440px; margin: 20px 0 0; color: rgba(255,255,255,.8); font-size: 16px; line-height: 1.65; }
    .visual-foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; color: rgba(255,255,255,.72); font-size: 12px; }
    .secure-note { display: inline-flex; align-items: center; gap: 8px; }
    .secure-dot { width: 8px; height: 8px; border-radius: 50%; background: #9de5bf; box-shadow: 0 0 0 4px rgba(157,229,191,.16); }

    .form-panel {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px clamp(28px, 7vw, 104px);
      background: #fff;
    }

    .form-content { width: min(100%, 420px); margin: 0 auto; }
    .mobile-wordmark { display: none; }
    .form-kicker { margin: 0 0 11px; color: var(--accent); font-size: 13px; font-weight: 700; }
    .form-content h2 { margin: 0 0 30px; font-family: "Manrope", sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 0; }
    .intro { margin: 10px 0 32px; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .field { display: grid; gap: 8px; margin-bottom: 19px; }
    .field label { color: #343d50; font-size: 13px; font-weight: 600; }
    .input-wrap { position: relative; }
    .field input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      color: var(--ink);
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field input::placeholder { color: #a0a8b3; }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(103,84,217,.12); }
    .password-input { padding-right: 54px !important; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 9px;
      width: 36px;
      height: 36px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 6px;
      color: #737d8d;
      background: transparent;
      font-size: 17px;
    }
    .password-toggle:hover { background: #f0f1f5; }
    .form-options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 3px 0 25px; }
    .remember { display: inline-flex; align-items: center; gap: 9px; color: #5f697a; font-size: 13px; cursor: pointer; }
    .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .text-link { color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; }
    .text-link:hover { text-decoration: underline; }
    .submit-button {
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      font-size: 15px;
      font-weight: 700;
      transition: background-color .15s ease, transform .15s ease;
    }
    .submit-button:hover { background: var(--accent-hover); }
    .submit-button:active { transform: translateY(1px); }
    .notice { display: none; margin: 16px 0 0; padding: 12px 14px; border: 1px solid #f0d8a9; border-radius: 7px; color: #76551b; background: #fff9eb; font-size: 13px; line-height: 1.5; }
    .notice.visible { display: block; }
    .divider { display: flex; align-items: center; gap: 14px; margin: 25px 0 20px; color: #9aa2ad; font-size: 12px; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #e9edf0; }
    .signup-line { margin: 0; color: var(--muted); text-align: center; font-size: 13px; }
    .form-footer { margin-top: 50px; color: #929aa6; text-align: center; font-size: 11px; }

    @media (max-width: 900px) {
      .login-page { grid-template-columns: minmax(0, .85fr) minmax(390px, 1.15fr); }
      .visual-panel { padding-inline: 34px; }
      .visual-copy h1 { font-size: 46px; }
      .form-panel { padding-inline: 42px; }
    }

    @media (max-width: 680px) {
      .login-page { min-height: 100vh; display: block; background: #fff; }
      .visual-panel { display: none; }
      .form-panel { min-height: 100vh; padding: 32px 24px 24px; }
      .form-content { width: min(100%, 430px); }
      .mobile-wordmark { display: inline-flex; margin-bottom: 48px; color: var(--ink); }
      .form-content h2 { font-size: 30px; }
      .intro { margin-bottom: 27px; }
      .form-footer { margin-top: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="visual-panel" aria-label="Taxes workspace">
      <a class="wordmark" href="home.html"><span class="brand-mark" aria-hidden="true">T</span> Taxes</a>
      <div class="visual-copy">
        <p class="eyebrow">Your taxes, in order</p>
        <h1>More clarity.<br>Less tax-season stress.</h1>
        <p>Keep your tax documents, deadlines, and next steps together in one secure workspace.</p>
      </div>
      <div class="visual-foot">
        <span>Built for a clearer financial picture.</span>
        <span class="secure-note"><span class="secure-dot" aria-hidden="true"></span> Secure workspace</span>
      </div>
    </section>

    <section class="form-panel" aria-labelledby="loginTitle">
      <div class="form-content">
        <a class="wordmark mobile-wordmark" href="home.html"><span class="brand-mark" aria-hidden="true">t</span> taxes</a>
        <h2 id="loginTitle">Sign in to taxes system</h2>

        <form id="loginForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input class="password-input" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">◉</button>
            </div>
          </div>
            <button class="submit-button" id="loginButton" type="submit">log in <span aria-hidden="true"></span></button>
          <p class="notice" id="formNotice" role="status" aria-live="polite"></p>
        </form>
          </div>
    </section>
  </main>

  <script>
    const passwordInput = document.querySelector('#password');
    const passwordToggle = document.querySelector('#passwordToggle');
    const formNotice = document.querySelector('#formNotice');
    const loginButton = document.querySelector('#loginButton');

    passwordToggle.addEventListener('click', () => {
      const showPassword = passwordInput.type === 'password';
      passwordInput.type = showPassword ? 'text' : 'password';
      passwordToggle.setAttribute('aria-pressed', String(showPassword));
      passwordToggle.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
    });

    document.querySelector('#loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      formNotice.classList.add('visible');
      formNotice.textContent = '';
      loginButton.disabled = true;

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.querySelector('#username').value,
            password: passwordInput.value
          })
        });

        if (response.ok) {
          window.location.assign('/home/');
          return;
        }

        formNotice.textContent = response.status === 403
          ? 'This account is inactive. Contact your administrator.'
          : response.status === 404
            ? 'The username or password is incorrect.'
            : 'Unable to sign in. Please try again.';
      } catch {
        formNotice.textContent = 'Unable to connect. Check your connection and try again.';
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
